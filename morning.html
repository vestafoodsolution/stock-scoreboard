<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>智囊團晨報</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#e3e6ea;--txt:#1d2733;--sub:#6b7683;
 --ok:#0a7d43;--warn:#b8860b;--bad:#c2382f;--accent:#1d2733}
*{box-sizing:border-box}
body{margin:0;font-family:"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px 60px}
header{padding:26px 0 6px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{margin:0;font-size:21px;letter-spacing:.5px}
.date{color:var(--sub);font-size:13px}
nav a{font-size:12.5px;color:#1160c9;text-decoration:none;border:1px solid var(--line);border-radius:16px;padding:4px 12px;background:var(--card)}
.headline{background:var(--accent);color:#fff;border-radius:14px;padding:18px 22px;font-size:16.5px;line-height:1.65;margin:14px 0 26px;text-wrap:balance}
.headline .tag{display:block;font-size:11px;letter-spacing:2px;color:#9aa7b5;margin-bottom:6px}
h2{font-size:14px;letter-spacing:1.5px;color:var(--sub);margin:30px 0 12px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;position:relative}
.tile .k{font-size:11.5px;color:var(--sub);display:flex;align-items:center;gap:6px}
.tile .v{font-size:18px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.tile .d{font-size:11.5px;margin-top:1px;font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad);box-shadow:0 0 0 4px #c2382f22}
.tile.bad{border-color:#f0c4bf;background:linear-gradient(180deg,#fff,#fdf5f4)}
.up{color:var(--ok)} .dn{color:var(--bad)} .fl{color:var(--sub)}
.alerts{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.alert{background:#fdf0ef;border:1px solid #f0c4bf;border-left:4px solid var(--bad);border-radius:9px;padding:9px 13px;font-size:13px}
.alert.warn{background:#fdf6e3;border-color:#ead9a8;border-left-color:var(--warn)}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.mem{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:13px}
.ava{width:52px;height:52px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
 font-size:22px;font-weight:800;color:#fff;letter-spacing:0}
.mem .who{font-weight:700;font-size:14.5px}
.mem .en{color:var(--sub);font-weight:400;font-size:11px;margin-left:4px}
.mem .beat{font-size:11px;color:var(--sub);margin-top:1px}
.mem .accy{font-size:11.5px;margin-top:3px;font-variant-numeric:tabular-nums}
.mem .accy b{font-size:13px}
.mem .say{font-size:13px;line-height:1.6;margin-top:7px;border-top:1px dashed var(--line);padding-top:7px}
.outlook{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 16px}
.sc h3{margin:0 0 6px;font-size:13.5px;display:flex;align-items:center;gap:8px}
.sc p{margin:0;font-size:12.8px;line-height:1.7;color:#333}
.sc .trig{margin-top:8px;font-size:11.5px;color:var(--sub);border-top:1px dashed var(--line);padding-top:7px}
.preds{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.preds table{width:100%;border-collapse:collapse;font-size:12.5px}
.preds th{background:#fbfcfd;color:var(--sub);font-size:11px;text-align:left;padding:8px 12px}
.preds td{padding:8px 12px;border-top:1px solid #eef1f4;vertical-align:top}
.badge{display:inline-block;padding:1px 8px;border-radius:12px;font-size:11px;font-weight:600}
.badge.pending{background:#eef1f4;color:var(--sub)}
.badge.hit{background:#e2f5ea;color:var(--ok)}
.badge.miss{background:#fbe7e5;color:var(--bad)}
.hist{font-size:12.5px;color:var(--sub);line-height:1.9}
footer{margin-top:36px;font-size:11.5px;color:var(--sub);line-height:1.7;border-top:1px solid var(--line);padding-top:12px}
@media(max-width:640px){.headline{font-size:15px}.members{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>🌅 智囊團晨報</h1>
  <span class="date" id="bdate"></span>
  <nav style="margin-left:auto"><a href="./">📊 存股評分表</a></nav>
</header>

<div class="headline" id="headline"><span class="tag">今日一句話</span><span id="headtxt"></span></div>

<div id="alerts"></div>

<h2>觀測燈板</h2>
<div id="tiles"></div>

<h2>智囊團 · 今日各自最重要的一件事</h2>
<div class="members" id="members"></div>

<h2>合議 · 未來一週展望(情境,非保證)</h2>
<div class="outlook" id="outlook"></div>

<h2>預測記錄簿(準確率的依據,每筆到期判定)</h2>
<div class="preds"><table id="predtbl">
<thead><tr><th>成員</th><th>預測(可驗證)</th><th>到期</th><th>結果</th></tr></thead><tbody></tbody>
</table></div>

<h2>近期晨報</h2>
<div class="hist" id="hist"></div>

<footer>本頁由智囊團系統每日 09:00 自動更新。所有數字來自公開資料(FinMind、Yahoo Finance),可驗證;預測以情境與觸發條件表達,不構成投資建議。準確率=已到期預測的命中比例,每月檢討一次並公布於成員名下。</footer>
</div>

<script>
const BRIEF = /*DATA*/{"date": "2026-07-18", "headline": "崩後第二天:全球無恙、台灣仍貴、融資未降——今天的工作是等待與處理減碼名單,不是進場。", "alerts": [{"level": "bad", "txt": "趨勢燈轉弱+單日 −6.46%:系統買進訊號全面關閉,15 檔亮減碼、10 檔賣出——反彈是出貨窗,不是上車門。"}, {"level": "warn", "txt": "市場溫度 79 仍在過熱區(估值溫度 96):跌了 6.5%,股票池殖利率仍只有自身常態的 47%。"}], "groups": [{"name": "台股與溫度計", "items": [{"label": "加權報酬指數", "value": 98229, "display": "98,229", "chg": -0.0646, "light": "bad"}, {"label": "距 52 週高點", "display": "−10.1%", "sub": "修正區", "light": "warn"}, {"label": "vs 60 日線", "display": "−1.3%", "sub": "已跌破", "light": "warn"}, {"label": "vs 200 日線", "display": "+26.1%", "sub": "乖離仍大", "light": "bad"}, {"label": "市場溫度", "value": 79, "display": "79 / 100", "sub": "過熱(亢奮期)", "light": "bad"}, {"label": "趨勢燈", "display": "轉弱", "sub": "跌破60日線+距高>8%", "light": "warn"}]}, {"name": "資金面", "items": [{"label": "融資餘額(距峰值)", "display": "−2.8%", "sub": "投降訊號 −20% 未達", "light": "warn"}, {"label": "融資 12 個月增速", "display": "+38.8%", "sub": "仍在高檔", "light": "bad"}, {"label": "美元/台幣", "value": 32.295, "display": "32.295", "sub": "5日 +0.45% 緩貶", "light": "warn"}]}, {"name": "全球股市(昨夜收盤)", "items": [{"label": "S&P 500", "value": 7457.69, "display": "7,458", "chg": -0.0101, "light": "warn"}, {"label": "那斯達克", "value": 25520.24, "display": "25,520", "chg": -0.014, "light": "warn"}, {"label": "費城半導體", "value": 11673.89, "display": "11,674", "chg": -0.0163, "light": "warn"}, {"label": "日經 225", "value": 64141.12, "display": "64,141", "chg": -0.0403, "light": "bad"}]}, {"name": "利率與風險", "items": [{"label": "美 10 年債殖利率", "display": "4.54%", "chg": -0.0061, "light": "warn"}, {"label": "VIX 恐慌指數", "value": 18.77, "display": "18.77", "sub": "+12% 但仍低位", "light": "ok"}, {"label": "美元指數", "value": 100.78, "display": "100.78", "chg": 0.0003, "light": "ok"}]}, {"name": "盤前風向(開盤前即時)", "items": [{"label": "S&P 500 期貨", "value": 7496.75, "display": "7,497", "chg": -0.0001, "light": "ok"}, {"label": "那斯達克期貨", "value": 28807, "display": "28,807", "chg": 0.0012, "light": "ok"}, {"label": "比特幣", "value": 64579, "display": "64,579", "chg": -0.0034, "light": "ok"}, {"label": "以太幣", "value": 1867.8, "display": "1,868", "chg": 0.0034, "light": "ok"}, {"label": "黃金", "value": 4007.9, "display": "4,008", "chg": -0.0012, "light": "ok"}]}, {"name": "你的股票池(59 檔)", "items": [{"label": "便宜度中位數", "value": 0.47, "display": "0.47", "sub": "常態=1,仍貴一倍", "light": "bad"}, {"label": "殖利率中位數", "display": "3.74%", "sub": "自身常態約 7-8%", "light": "warn"}, {"label": "進入便宜區檔數", "display": "4 / 59", "sub": "漢來美食、勤美、雲品、華固", "light": "warn"}]}], "members": [{"id": "marks", "name": "馬克斯", "en": "Howard Marks", "beat": "台股週期與溫度計", "color": "#0a7d43", "initial": "馬", "acc": {"hit": 0, "total": 0}, "today": "溫度 79、離 200 日線仍 +26%——跌一天不改變「仍在過熱區」的事實。今天若反彈,把它讀成逃命波,不是多頭回歸。"}, {"id": "kost", "name": "科斯托蘭尼", "en": "André Kostolany", "beat": "資金面:融資與台幣", "color": "#b0533a", "initial": "科", "acc": {"hit": 0, "total": 0}, "today": "融資距峰值只 −2.8%、台幣五日僅貶 0.45%:顫抖的手還沒交貨,外資只是慢走。到 −20% 之前,別跟我談底部。"}, {"id": "lynch", "name": "彼得・林區", "en": "Peter Lynch", "beat": "全球股市與盈餘動能", "color": "#c2762f", "initial": "林", "acc": {"hit": 0, "total": 0}, "today": "費半昨夜僅 −1.63%、美股期貨盤前持平——全球沒有跟著崩。台灣跌的是自己的估值:EPS 中位數 −4.6%,指數卻漲了一年。"}, {"id": "dalio", "name": "瑞・達利歐", "en": "Ray Dalio", "beat": "聯準會、利率與加密貨幣", "color": "#1160c9", "initial": "達", "acc": {"hit": 0, "total": 0}, "today": "10 年債 4.54% 沒有避險搶購、VIX 18.8、比特幣 64,579 僅 −0.3%:三個訊號同說「非系統性危機」。今天該測試的是你的現金水位,不是你的預測能力。"}, {"id": "graham", "name": "葛拉漢", "en": "Benjamin Graham", "beat": "安全邊際與估值紀律", "color": "#6b4f8a", "initial": "葛", "acc": {"hit": 0, "total": 0}, "today": "崩完後便宜度中位數 0.47——離常態(1.0)還有一半的路。便宜區只有 4 檔。安全邊際不是感覺,是名單長度,而它還很短。"}, {"id": "buffett", "name": "巴菲特", "en": "Warren Buffett", "beat": "好球名單與價格帶", "color": "#8a5a2b", "initial": "巴", "acc": {"hit": 0, "total": 0}, "today": "威剛 366.5,距便宜價 324 差 12%;漢來美食 169.5,距 161 差 5%。球在飛過來,但還沒進帶——舉棒,不揮棒。"}, {"id": "munger", "name": "查理・蒙格", "en": "Charlie Munger", "beat": "紅線與行為紀律", "color": "#4a4e69", "initial": "蒙", "acc": {"hit": 0, "total": 0}, "today": "今天最不該做的事:因為統一(80)、聯電(144)、兆豐金(47.6)「跌很多」去攤平。它們在減碼名單上,是有原因的。"}], "outlook": {"bull": {"p": "低", "txt": "三日內快速收復 60 日線(約 99,500)、融資止穩、費半未再破位——恐慌未擴散,回到過熱慣性盤,嚴選門重開(僅漢來美食等級)。", "trigger": "站回 60 日線+溫度回落至 75 以下+費半守住 11,000"}, "base": {"p": "中高", "txt": "反彈與再測本週低點之間的震盪整理。量縮、融資緩降、價穩之前不會有真底;操作上以處理減碼名單為主,買進持續關閉。", "trigger": "融資週減速度、便宜度中位數能否升破 0.55、台幣是否止貶"}, "bear": {"p": "中", "txt": "跌破本週低點且融資單週減幅 >5% → 進入主跌段(科斯托蘭尼 B2),乖離 +26% 的清算開始,方向看向 200 日線(76,737)。", "trigger": "破本週低點+融資加速下降+台幣單週貶幅 >1%"}}, "predictions": [{"id": "p1", "member": "marks", "date": "2026-07-18", "due": "2026-07-25", "claim": "一週內台股報酬指數不創新高(不超過 105,018)", "verify": "07-25 前每日收盤最大值 ≤105,018 → 命中", "status": "pending"}, {"id": "p2", "member": "kost", "date": "2026-07-18", "due": "2026-08-01", "claim": "兩週內融資餘額續降、跌破 9,200(千張)", "verify": "任一日 MarginPurchase TodayBalance <9,200,000 → 命中", "status": "pending"}, {"id": "p3", "member": "lynch", "date": "2026-07-18", "due": "2026-07-25", "claim": "一週內費城半導體不跌破 11,000(全球不接棒下殺)", "verify": "期間最低價 ≥11,000 → 命中", "status": "pending"}, {"id": "p4", "member": "dalio", "date": "2026-07-18", "due": "2026-08-01", "claim": "兩週內 VIX 不觸及 30(非系統性危機)", "verify": "期間最高 <30 → 命中", "status": "pending"}, {"id": "p5", "member": "graham", "date": "2026-07-18", "due": "2026-07-25", "claim": "一週內股票池便宜度中位數仍 <0.6(反彈不改變貴)", "verify": "07-25 晨報計算值 <0.6 → 命中", "status": "pending"}, {"id": "p6", "member": "buffett", "date": "2026-07-18", "due": "2026-08-01", "claim": "兩週內威剛(3260)出現 ≤324 的價格(進入便宜價)", "verify": "期間最低價 ≤324 → 命中", "status": "pending"}, {"id": "p7", "member": "munger", "date": "2026-07-18", "due": "2026-08-01", "claim": "兩週內減碼名單(統一、聯電、兆豐金)平均報酬落後 0056", "verify": "三檔平均漲跌 < 0056 漲跌 → 命中", "status": "pending"}], "history": [{"date": "2026-07-18", "headline": "首刊:崩後第二天,全球無恙、台灣仍貴、融資未降——等待與減碼,不進場。"}]}/*END*/;

const fmt=(v,d)=>v==null?'—':(+v).toLocaleString('zh-TW',{minimumFractionDigits:d??0,maximumFractionDigits:d??2});
const pc=v=>v==null?'':((v>=0?'+':'')+(v*100).toFixed(2)+'%');
const cls=v=>v==null?'fl':(v>0.0001?'up':v<-0.0001?'dn':'fl');

document.getElementById('bdate').textContent=BRIEF.date+'(台北時間 09:00)';
document.getElementById('headtxt').textContent=BRIEF.headline;

// 警報
const alertsEl=document.getElementById('alerts');
if(BRIEF.alerts&&BRIEF.alerts.length){
  alertsEl.innerHTML='<div class="alerts">'+BRIEF.alerts.map(a=>`<div class="alert ${a.level==='warn'?'warn':''}">${a.level==='warn'?'🟡':'🔴'} ${a.txt}</div>`).join('')+'</div>';
}

// 燈板
const tiles=document.getElementById('tiles');
tiles.innerHTML=BRIEF.groups.map(g=>`<h2 style="margin-top:18px">${g.name}</h2><div class="grid">`+
  g.items.map(t=>`<div class="tile ${t.light==='bad'?'bad':''}">
    <div class="k"><span class="dot ${t.light}"></span>${t.label}</div>
    <div class="v">${t.display??fmt(t.value)}</div>
    <div class="d ${cls(t.chg)}">${t.sub??pc(t.chg)}</div>
  </div>`).join('')+'</div>').join('');

// 成員卡
document.getElementById('members').innerHTML=BRIEF.members.map(m=>{
  const acc=m.acc&&m.acc.total>0?`<b>${Math.round(m.acc.hit/m.acc.total*100)}%</b> <span style="color:var(--sub)">(${m.acc.hit}/${m.acc.total})</span>`
    :`<span style="color:var(--sub)">準確率:樣本累積中${m.acc&&m.acc.total===0?'':''}</span>`;
  return `<div class="mem">
    <div class="ava" style="background:${m.color}">${m.initial}</div>
    <div style="flex:1">
      <div class="who">${m.name}<span class="en">${m.en}</span></div>
      <div class="beat">盯盤:${m.beat}</div>
      <div class="accy">${m.acc&&m.acc.total>0?'準確率 ':''}${acc}</div>
      <div class="say">${m.today}</div>
    </div></div>`;
}).join('');

// 週展望
const ICONS={bull:['🟢','偏多情境'],base:['⚪','基準情境'],bear:['🔴','偏空情境']};
document.getElementById('outlook').innerHTML=['bull','base','bear'].map(k=>{
  const s=BRIEF.outlook[k]; if(!s)return '';
  return `<div class="sc"><h3>${ICONS[k][0]} ${ICONS[k][1]}${s.p?`<span style="color:var(--sub);font-weight:400;font-size:11.5px">機率感:${s.p}</span>`:''}</h3>
    <p>${s.txt}</p><div class="trig">觸發觀察:${s.trigger}</div></div>`;
}).join('');

// 預測記錄簿
const nameOf=id=>{const m=BRIEF.members.find(x=>x.id===id);return m?m.name:id;};
document.querySelector('#predtbl tbody').innerHTML=BRIEF.predictions.map(p=>`<tr>
  <td>${nameOf(p.member)}</td><td>${p.claim}</td><td>${p.due}</td>
  <td><span class="badge ${p.status}">${p.status==='pending'?'觀察中':p.status==='hit'?'✓ 命中':'✗ 未中'}</span></td></tr>`).join('');

// 歷史
document.getElementById('hist').innerHTML=(BRIEF.history||[]).map(h=>`<div>▸ ${h.date} — ${h.headline}</div>`).join('');
</script>
</body>
</html>
